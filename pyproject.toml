[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finagent"
version = "0.1.0"
description = "10-K financial analyst agent: RAG over SEC filings, table extraction, verified calculations and page citations, evaluated on FinanceBench."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Asjad" }]
keywords = ["llm", "ai-agent", "rag", "finance", "sec-edgar", "10-k", "financebench", "claude"]
dependencies = ["pydantic>=2.6", "pdfplumber>=0.11", "scikit-learn>=1.4", "numpy>=1.26"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
ui = ["streamlit>=1.36", "pandas>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "ruff>=0.5"]
all = ["finagent[claude,openai,api,ui,dev]"]

[project.scripts]
finagent = "finagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["B008", "E501", "B905"]  # FastAPI File()/Form() defaults are the documented pattern; long regexes stay on one line
